name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set production API base URL
        run: |
          printf "window.ZARECHNOE_API_BASE = 'https://api.zarechnoe.dpdns.org/api/v1';\n" > ui/public/deploy-config.js
      - name: Cache-bust static assets
        run: |
          V="${{ github.sha }}"
          sed -i "s|\./app\.js|./app.js?v=$V|g; s|\./styles\.css|./styles.css?v=$V|g" ui/public/index.html
          grep -E 'styles\.css|src="\./app\.js' ui/public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
