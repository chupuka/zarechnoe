services:
  # PostgreSQL 16 + PostGIS — единая БД для ядра и микросервиса
  db:
    image: postgis/postgis:16-3.4
    container_name: farm_pg
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm
    ports:
      - "5433:5432"
    volumes:
      - farm_pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farm -d farm"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ядро: REST API + раздача адаптивного веб-интерфейса
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: farm_api
    environment:
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: farm
      PGPASSWORD: farm
      PGDATABASE: farm
      REPORTS_HOST: reports
      REPORTS_PORT: 4000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/app/backups

  # Дополнительный сервис: тяжёлая аналитика (свой пул, только чтение)
  reports:
    build:
      context: ./services/reports
    container_name: farm_reports
    environment:
      REPORTS_PORT: 4000
      PGHOST: db
      PGPORT: 5432
      PGUSER: farm
      PGPASSWORD: farm
      PGDATABASE: farm
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  farm_pgdata:
