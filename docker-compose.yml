services:
  # Ядро: REST API + раздача адаптивного веб-интерфейса.
  # БД — внешняя (Supabase): локальный контейнер PostgreSQL не поднимаем.
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: farm_api
    environment:
      PORT: 3000
      PGHOST: ${PGHOST:-aws-0-eu-central-1.pooler.supabase.com}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?задай PGPASSWORD в .env}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGSSLMODE: ${PGSSLMODE:-require}
      REPORTS_HOST: reports
      REPORTS_PORT: 4000
      # Ключ шифрования ПДн сотрудников (ТЗ п.7). В БД не хранится — только здесь.
      PII_KEY: ${PII_KEY:?задай PII_KEY в .env}
      # Планировщик резервного копирования (проверка расписания раз в минуту)
      BACKUP_SCHEDULER: ${BACKUP_SCHEDULER:-on}
      BACKUP_TICK_MS: ${BACKUP_TICK_MS:-60000}
      PYTHON_BIN: python3
      FARM_PSQL_MODE: local
      FARM_BACKUP_DIR: /app/backups
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backups:/app/backups

  # Дополнительный сервис: тяжёлая аналитика (свой пул, только чтение)
  reports:
    build:
      context: ./services/reports
    container_name: farm_reports
    environment:
      REPORTS_PORT: 4000
      PGHOST: ${PGHOST:-aws-0-eu-central-1.pooler.supabase.com}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?задай PGPASSWORD в .env}
      PGDATABASE: ${PGDATABASE:-postgres}
      PGSSLMODE: ${PGSSLMODE:-require}
    ports:
      - "127.0.0.1:4000:4000"
